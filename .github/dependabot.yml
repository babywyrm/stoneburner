version: 2

updates:
  # Python dependencies via uv.lock. Grouped so a routine week produces one PR
  # to review rather than a dozen; security updates stay ungrouped so they are
  # never buried in a batch.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
        update-types:
          - "minor"
          - "patch"
      runtime-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # 2.1+ wraps tool errors and drops the API detail the agent needs.
      - dependency-name: "mcp"
        versions: [">=2.1.0"]
      # 3.x taken in-tree. Ignore 4+ until a dedicated pass.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
      # HTTPX2 core-dep jump. Same class as the old openai 3 park.
      - dependency-name: "anthropic"
        update-types: ["version-update:semver-major"]
      # rag extra. Stay on 5.7 until someone asks for the 6.x encode path.
      - dependency-name: "sentence-transformers"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
