name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The api extra is required, not optional: tests/test_api_*.py and
      # tests/test_distributed_*.py import fastapi at module scope, so without
      # it collection errors out. The openai/bedrock/rag extras stay out — those
      # tests skip themselves cleanly and rag pulls the full torch stack.
      - name: Sync dependencies
        run: uv sync --extra dev --extra api

      - name: Lint
        run: uv run ruff check atomics/ tests/ --ignore E501

      - name: Type check
        run: uv run mypy atomics/

      # addopts in pyproject supplies --cov=atomics --cov-report=term-missing.
      # The floor is deliberately below current coverage (87.1%) so it catches
      # regressions rather than blocking unrelated work; raise it as coverage
      # improves. Focused local runs stay ungated because the threshold lives
      # here rather than in addopts.
      - name: Run tests
        run: uv run pytest -q --tb=short --cov-fail-under=85
