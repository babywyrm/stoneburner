name: publish

on:
  push:
    tags:
      - "v[0-9]*"

# id-token is granted only on the PyPI job. The listing name is
# `stoneburner-atomics`; the import and CLI stay `atomics`. Register the
# trusted publisher on PyPI before the first tag that should upload —
# see RELEASING.md.
permissions:
  contents: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Publishes the hand-written changelog entry rather than asking GitHub to
      # summarize commits. `generate_release_notes` produced empty bodies here:
      # it diffs against the previous tag, and the floating major tag below is
      # always at the newest release, so there was nothing in between. Exits
      # non-zero when the tag has no changelog section, which fails the release
      # instead of publishing a blank one.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/changelog_section.py "$version" > "$RUNNER_TEMP/notes.md"
          {
            echo "title=$(python3 scripts/changelog_section.py --title "$version")"
            echo "path=$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/*

      # A `v0` tag tracking the newest release, for workflows that want to
      # follow the major line. It is deliberately mutable, which is why release
      # notes are no longer derived from tag-to-tag diffs.
      - name: Update floating major tag
        shell: bash
        run: |
          MAJOR="$(echo "${GITHUB_REF_NAME}" | sed 's/\..*//')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "${MAJOR}" -m "Update ${MAJOR} to ${GITHUB_REF_NAME}"
          git push origin "${MAJOR}" --force

  # Independent of the GitHub release so a missing trusted publisher does not
  # blank the release page the way the old `atomics` name collision did.
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish
        run: uv publish
