name: publish

on:
  push:
    tags:
      - "v[0-9]*"

# Write scopes are granted per job: contents on the release job, id-token on
# the PyPI job. The build job runs build-backend code and gets neither. The
# listing name is `stoneburner-atomics`; the import and CLI stay `atomics`.
# Register the trusted publisher on PyPI before the first tag that should
# upload — see RELEASING.md.
permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache on release paths: other workflows can write the cache, and a
      # poisoned entry would ship inside the distribution.
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Build
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Keeps its credentials for the floating-tag push below. This job
      # uploads no artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Publishes the hand-written changelog entry rather than asking GitHub to
      # summarize commits. `generate_release_notes` produced empty bodies here:
      # it diffs against the previous tag, and the floating major tag below is
      # always at the newest release, so there was nothing in between. Exits
      # non-zero when the tag has no changelog section, which fails the release
      # instead of publishing a blank one.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/changelog_section.py "$version" > "$RUNNER_TEMP/notes.md"
          {
            echo "title=$(python3 scripts/changelog_section.py --title "$version")"
            echo "path=$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/*

      # A `v0` tag tracking the newest release, for workflows that want to
      # follow the major line. It is deliberately mutable, which is why release
      # notes are no longer derived from tag-to-tag diffs.
      - name: Update floating major tag
        shell: bash
        run: |
          MAJOR="$(echo "${GITHUB_REF_NAME}" | sed 's/\..*//')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "${MAJOR}" -m "Update ${MAJOR} to ${GITHUB_REF_NAME}"
          git push origin "${MAJOR}" --force

  # Independent of the GitHub release so a missing trusted publisher does not
  # blank the release page the way the old `atomics` name collision did.
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Publish
        run: uv publish
