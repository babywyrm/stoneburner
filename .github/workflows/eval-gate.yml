# Eval gate — CI workflow for quality and security regression checks.
#
# Runs the test suite, then optionally runs eval/adversarial suites against
# a configured provider. Use --fail-on-resilience to gate on security
# thresholds.
#
# Triggers: push to main, PRs, manual dispatch.
#
# Required secrets:
#   ANTHROPIC_API_KEY — for Claude provider (optional, skip cloud evals if unset)
#   OPENAI_API_KEY   — for OpenAI provider (optional)
#
# For local-only CI (Ollama), set up a self-hosted runner with Ollama installed.

name: Eval Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider for eval suites"
        type: choice
        options: [skip, claude, openai, ollama]
        default: skip
      min_resilience:
        description: "Minimum adversarial resilience % (0 to skip)"
        type: number
        default: 0

permissions:
  contents: read

env:
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, for the release-invariant tests. See ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      # The api extra is required, not optional: tests/test_api_*.py and
      # tests/test_distributed_*.py import fastapi at module scope, so without
      # it pytest errors during collection.
      - name: Install dependencies
        run: uv sync --extra dev --extra api --extra mcp --extra claude --extra openai --extra bedrock

      - name: Run tests
        run: uv run pytest -q --tb=short

      - name: Type check
        run: uv run mypy atomics

  doctor:
    name: Doctor
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run atomics doctor

  eval-gate:
    name: Eval Gate
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.provider != 'skip'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PROVIDER: ${{ github.event.inputs.provider }}
      MIN_RESILIENCE: ${{ github.event.inputs.min_resilience }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra claude --extra openai --extra bedrock

      - name: Run eval suite
        run: |
          uv run atomics eval \
            --provider "$PROVIDER" \
            --no-save \
            --json-out eval-results.json

      - name: Run adversarial suite
        if: github.event.inputs.min_resilience != '0'
        run: |
          uv run atomics adversarial \
            --provider "$PROVIDER" \
            --fail-on-resilience "$MIN_RESILIENCE" \
            --no-save \
            --json-out adversarial-results.json

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: |
            eval-results.json
            adversarial-results.json
          retention-days: 30
