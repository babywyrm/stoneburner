name: security

on:
  push:
    branches: [main]
  pull_request:
  # Dependencies do not change when the code does — a CVE lands against a
  # version already pinned in uv.lock. The weekly run is what actually catches
  # those; the push/PR runs only stop a known-vulnerable pin being introduced.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"

      # --frozen so the audit reflects the committed lockfile rather than a
      # fresh resolution that might silently pick up an unpinned fix.
      - name: Sync dependencies
        run: uv sync --extra dev --extra api --extra mcp --extra claude --extra openai --extra bedrock --frozen

      # Audits the resolved environment. Running pip-audit against an exported
      # requirements file instead makes it build its own resolution venv, which
      # is slower and can fail for reasons unrelated to the project.
      - name: Audit dependencies
        run: uv run --with pip-audit pip-audit

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"

      # -ll is medium severity and above. The low band is 60 findings that are
      # structural for this codebase and not defects: asserts in fixtures,
      # `random` for task shuffling, and argv-list subprocess calls. Gating on
      # them would mean 60 suppressions, and a gate everyone suppresses is not a
      # gate. Medium and high are at zero, so any new finding is a real one.
      #
      # The audited exceptions carry an inline `# nosec <id>` with the reason on
      # the line above. Bandit reads every word after `# nosec` as a test id, so
      # the reason cannot share that line.
      - name: Static analysis
        run: uv run --with bandit bandit -q -r atomics/ scripts/ -ll

      # Workflow audit: unpinned actions, template injection, cache poisoning,
      # persisted credentials. Exceptions carry `# zizmor: ignore[<audit>]`
      # with the reason above them.
      - name: Audit workflows
        run: uvx zizmor@1.31.1 --offline --min-severity low .github/workflows

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # Full history: the point is what has ever been committed, not what the
      # tip happens to contain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The binary rather than gitleaks-action, whose licensing differs for
      # organization-owned repositories.
      #
      # Pinned to the version SECURITY.md tells you to run locally. This is not
      # cosmetic: 8.24.3 ignores the top-level [[allowlists]] blocks that
      # .gitleaks.toml is built on, so it reported nine findings — documented
      # `curl -H "X-API-Key: $ATOMICS_API_KEY"` examples and a fixture named
      # dummy-key-for-tests-not-a-secret — that the configured version does
      # not. A scanner that disagrees with the one developers run is worse than
      # no scanner, because the failures get waved through. Move both together,
      # and take the new SHA-256 from the release's checksums.txt.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan committed history
        run: gitleaks git --no-banner --config .gitleaks.toml --redact

      - name: Scan working tree
        run: gitleaks dir --no-banner --config .gitleaks.toml --redact
