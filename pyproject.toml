[project]
name = "stoneburner-atomics"
version = "0.21.0"
description = "Local-first LLM eval: token cost, quality, and security suites. CLI is atomics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "babywyrm" }]
keywords = [
    "llm",
    "eval",
    "ollama",
    "benchmark",
    "prompt-injection",
    "tool-calling",
    "mcp",
    "red-team",
    "local-llm",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.39.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.35.0"]
openai = ["openai>=1.40.0"]
rag = [
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=3.0.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
# The MCP server is a proxy over a running API server, so it needs no provider
# or storage dependency of its own — httpx is already a core dependency.
mcp = [
    "mcp>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
atomics = "atomics.cli:cli"

[project.urls]
Homepage = "https://github.com/babywyrm/stoneburner"
Repository = "https://github.com/babywyrm/stoneburner"
Documentation = "https://github.com/babywyrm/stoneburner/blob/main/QUICKSTART.md"
Changelog = "https://github.com/babywyrm/stoneburner/blob/main/CHANGELOG.md"
Issues = "https://github.com/babywyrm/stoneburner/issues"
PyPI = "https://pypi.org/project/stoneburner-atomics/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests use looser conventions by design: imports grouped near usage (E402),
# scaffolding locals that assert-by-construction (F841), and fixture-shaped
# local names (N806).
"tests/*" = ["E402", "F841", "E741", "N806", "N814"]
# Fixture payloads are scored as written. Wrapping them to 100 chars would
# change the prompt the model sees, or make the gold text unreadable.
"atomics/eval/**/fixtures.py" = ["E501"]
"atomics/eval/adversarial/multiturn.py" = ["E501"]
"atomics/eval/adversarial/agentic_reasoning.py" = ["E501"]
"atomics/eval/fixtures.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# The whole package is type-checked — no per-module error suppressions remain.
# `ignore_missing_imports` stays on for optional/stub-less third-party deps.

[[tool.mypy.overrides]]
# Optional [rag] stack: installed numpy stubs use 3.12+ `type` statements, which
# are a syntax error under python_version = "3.11". `follow_imports = "skip"`
# alone is not enough — mypy still parses a stub it can find, and the failure is
# at parse time. `follow_imports_for_stubs` extends the skip to the .pyi files.
# Checking against 3.11 is deliberate: requires-python allows it, so the project
# must not use syntax that only works on newer interpreters.
module = [
    "numpy",
    "numpy.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "sqlite_vec",
    "sqlite_vec.*",
    "torch",
    "torch.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: isolated tests without network or external services",
    "integration: tests that span multiple subsystems (still local)",
    "network: tests that hit real network or external APIs (opt-in)",
]
addopts = [
    "--cov=atomics",
    "--cov-report=term-missing",
]

[tool.hatch.build.targets.sdist]
exclude = [".venv", "logs", "data", "1"]

[tool.hatch.build.targets.wheel]
packages = ["atomics"]
