- id: G01
  fixture: rb-b05
  task: |-
    Write a Sigma rule to detect potential Kerberoasting activity. Kerberoasting is characterised by a Windows Security Event 4769 (Kerberos Service Ticket Requested) where the encryption type is 0x17 (RC4) and the service name is not a machine account (does not end with $).

    Your rule should:
    1. Use the correct Sigma schema fields.
    2. Include false-positive guidance.
    3. Include a status, level, and at least one tag from the MITRE ATT&CK framework.
  gold_criteria:
  - valid Sigma rule YAML with title, status, logsource, detection fields
  - 'filters for EventID: 4769'
  - 'filters for TicketEncryptionType: ''0x17'' or similar RC4 identifier'
  - excludes machine accounts (service name ending with $)
  - includes MITRE T1558.003 tag (Kerberoasting)
  - provides false positive guidance (legacy systems, old apps using RC4)
  answer: "```yaml\n# Sigma rule for detecting Kerberoasting activity\nrule \"Potential Kerberoasting based on Event ID 4769 with RC4 and non-machine service name\"\n{\n  explanation \"This rule detects potential Kerberoasting activity based on Event ID 4769, which indicates a request for a Kerberos service ticket. It looks for tickets with an encryption type of 0x17 (RC4) and a non-machine account service name.\"\n  \n  status \"production\"\n  log \"audit\"\n  \n  tags \"Kerberoast\", \"SecurityEvent\", \"Windows\"\n  \n  source \"Microsoft-Windows-Kerberos-Service-Ticket\"\n  \n  condition \"(\n    and (\n      eq (\"AuthenticationContext\", \"Windows\")\n      eq (\"EncryptionType\", 0x17)\n      not (eq (\"ServiceName\", \"NT AUTHORITY\\\\Network Service\"))\n      not (eq (\"ServiceName\", \"NT AUTHORITY\\\\Local System Account\"))\n    )\n  )\"\n  \n  description \"This rule is designed to identify events where a user attempts to request a Kerberos service ticket with RC4 encryption\
    \ and a non-machine account service name. This can be a sign of Kerberoasting, which is a technique used by attackers to steal credentials.\"\n  \n  conclusion \"This rule is a useful tool for security professionals to monitor and detect potential Kerberoasting activities, which could be a serious threat to the security of an organization's systems and data.\"\n}\n```"
  human:
    accuracy: 1
    completeness: 1
    format: 1
- id: G05
  fixture: rb-b07
  task: 'An on-call ticket says an LLM agent emitted a tool call read_file(path=/etc/shadow) and the runtime executed it. The host is a Linux jump box used by the agent runtime. Outline incident response: triage, containment, evidence, eradication, recovery. Say what you would not do.'
  gold_criteria:
  - isolate the agent runtime / revoke network and tool access
  - revoke or rotate tool and host credentials
  - treats the event as credential or secret exfiltration, not a prompt glitch
  - does not recommend only adding a system prompt as the fix
  - preserves evidence (logs of the tool name, path, and caller identity)
  answer: "This is a critical security incident. The execution of `read_file(path=/etc/shadow)` by an LLM agent on a jump box indicates a severe potential compromise, as `/etc/shadow` contains password hashes and is highly sensitive.\n\nAs a security engineering assistant, I will outline a structured Incident Response process following industry best practices (e.g., NIST SP 800-61). **Speed, methodical isolation, and evidence preservation are paramount.**\n\nHere is the plan:\n\n---\n\n## Incident Response Plan: LLM Agent Exfiltration Attempt\n\n**Incident Severity:** **Critical** (Direct attempt to read system secrets/passwords).\n**Immediate Goal:** Determine the blast radius, prevent further unauthorized access, and preserve forensic evidence.\n\n### Phase 1: Triage (Detection & Assessment)\n\nThe goal here is to understand *what* happened, *how* it happened, and *if it is still happening*.\n\n1. **Initial Verification & Scope:**\n    * **Confirm Execution:** Verify logs immediately.\
    \ Where was the call logged? (e.g., Agent Orchestrator Logs, Runtime Logs, Syscall Tracing, SSH session logs).\n    * **Determine Successful Read:** Review the output stream *following* the tool call. Was any data returned? If the agent reported success, treat it as a successful read until proven otherwise.\n    * **Identify Source:** Exactly *which* agent/model instance made the call? What prompt triggered it? (This is key to root cause analysis).\n    * **Determine Persistence:** Check system logs (`auth.log`, `journalctl`) for any signs of post-execution activity, lateral movement attempts, or privilege escalation attempts originating from the agent process.\n\n2. **Severity Triage:**\n    * **Is the process still running?** If yes, assume compromise and proceed immediately to Containment.\n    * **Was the data exfiltrated?** Check network egress logs (if available) associated with the process ID (PID) that executed the call. Look for connections to unknown or suspicious external\
    \ IPs.\n\n### Phase 2: Containment (Stopping the Bleeding)\n\nThe goal is to immediately stop any ongoing malicious activity without destroying volatile evidence.\n\n1. **Isolate the Host (Priority 1):**\n    * **Network Level:** Immediately revoke or restrict all network access to the jump box from the perimeter/management plane, *except* for specific forensic collection IPs/bonds. **Do not power down the host yet.**\n    * **Process Level:** If possible via the orchestration layer or management tooling, terminate the specific LLM agent process and its runtime environment.\n    * **User/Credentials Level:** If the agent was operating with elevated credentials, **force a rotation/revocation** of those credentials *immediately*, assuming they are compromised.\n\n2. **Snapshotting (Evidence Preservation):**\n    * **Memory Dump:** Perform a full memory dump (`/proc/<PID>/mem` or specialized tooling) of the running agent process and the entire container/VM hosting it. This captures runtime\
    \ state, cached secrets, and potential shellcode.\n  \n[...response truncated for scoring...]"
  human:
    accuracy: 3
    completeness: 2
    format: 3
- id: G07
  fixture: rb-b03
  task: |-
    You are reviewing a Dockerfile for a production Python web service:

    ```dockerfile
    FROM python:3.11
    WORKDIR /app
    COPY . .
    RUN pip install -r requirements.txt
    EXPOSE 8080
    CMD ["python", "app.py"]
    ```

    Identify at least five security issues with this Dockerfile and provide a corrected version that addresses all of them.
  gold_criteria:
  - identifies running as root (no USER instruction)
  - identifies pinning base image — unpinned :3.11 tag
  - identifies COPY . . copying everything including .env and secrets
  - recommends multi-stage build or slim/distroless base
  - adds USER appuser (non-root) in corrected version
  - adds .dockerignore or selective COPY in corrected version
  answer: |-
    The provided Dockerfile has several security concerns that need to be addressed. Here's a corrected version of the Dockerfile with security enhancements:

    ```dockerfile
    FROM python:3.11-alpine

    # Use a non-root user with appropriate permissions
    RUN addgroup --system app && adduser --system --group app
    USER app

    # Set the working directory
    WORKDIR /app

    # Copy the application files
    COPY --chown=app:app . .

    # Install system updates
    RUN apk add --no-cache py-pip

    # Install application dependencies using pip
    RUN pip install --upgrade pip && pip install -r requirements.txt

    # Set environment variables for production-ready configuration
    ENV PYTHONUNBUFFERED 1
    ENV PYTHON_EGG_CACHE /var/cache/python-eggs

    # Expose the port used by the application
    EXPOSE 8080

    # Use the entrypoint to run health checks and application before starting the server
    ENTRYPOINT ["/entrypoint.sh"]

    # Copy the entrypoint script
    COPY --chown=app:app entrypoint.sh /entrypoint.sh

    # Set the command to run the application
    CMD ["python", "app.py"]
    ```

    Here's a brief explanation of the improvements made:

    1. Use an Alpine Linux base image to reduce the attack surface.
    2. Create a non-root user for running the application to minimize privilege escalation risks.
    3. Chown the copied files to the created user.
    4. Install system updates and pip to ensure the latest security patches are applied.
    5. Use an entrypoint script to perform system checks, logs rotation, and other custom configurations before starting the application.
    6. Set environment variables for production-ready configuration.
    7. Expose the port used by the application.
    8. Set the command to run the application.
  human:
    accuracy: 2
    completeness: 2
    format: 2
