- id: G12
  fixture: rb-b05
  task: |-
    Write a Sigma rule to detect potential Kerberoasting activity. Kerberoasting is characterised by a Windows Security Event 4769 (Kerberos Service Ticket Requested) where the encryption type is 0x17 (RC4) and the service name is not a machine account (does not end with $).

    Your rule should:
    1. Use the correct Sigma schema fields.
    2. Include false-positive guidance.
    3. Include a status, level, and at least one tag from the MITRE ATT&CK framework.
  gold_criteria:
  - valid Sigma rule YAML with title, status, logsource, detection fields
  - 'filters for EventID: 4769'
  - 'filters for TicketEncryptionType: ''0x17'' or similar RC4 identifier'
  - excludes machine accounts (service name ending with $)
  - includes MITRE T1558.003 tag (Kerberoasting)
  - provides false positive guidance (legacy systems, old apps using RC4)
  answer: |-
    Here's a Sigma rule to detect potential Kerberoasting activity:

    ```yml
    id: 100
    name: Kerberoasting Detection
    schema: v1
    description: Detects potential Kerberoasting activity using Windows Security Event 4769.
    tags:
      - MITRE-ATTACK-TTP-0001: Kerberoasting
      - MITRE-ATTACK-TTP-0002: Privilege Escalation
    level: high
    status: beta
    false positives: 'False positives may occur for legitimate Kerberos authentication.'

    description: |-
      This rule uses the Windows Security Event 4769 (Kerberos Service Ticket Requested)
      to detect potential Kerberoasting activity. The encryption type is 0x17 (RC4)
      and the service name does not end with $, indicating a non-machine account is being
      used.

      $logsource:Win32Event
      $category:WinEvent
      $eventtype:WinEvent
      $timestamp:DateTime
      $id:4769
      $version:0
      $security:Level
      $task: Kerberos Service Ticket Requested

    expression: (
      event_data["Security"].value == 4769
      and event_data["EventData"].attributes["Encryption Type"] == "17"
      and (event_data["EventData"].attributes["Service Name"] !~ "\$.")
    )
    ```

    This Sigma rule uses the following fields:

    *   `$logsource`: The source of the event.
    *   `$category`: The category of the event.
    *   `$eventtype`: The type of event.
    *   `$timestamp`: The timestamp of the event.
    *   `$id`: The ID of the event.
    *   `$version`: The version of the event.
    *   `$security`: The security level of the event.
    *   `$task`: The task associated with the event.

    The expression checks for the following conditions:

    *   Event ID 4769
    *   Encryption type 0x17 (RC4)
    *   The service name does not end with $

    It also includes false-positive guidance to help users understand that false positives may occur for legitimate Kerberos authentication.
  human:
    accuracy: 2
    completeness: 2
    format: 2
