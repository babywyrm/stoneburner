items:
- id: R01
  fixture: rb-r01
  task: |-
    List five passive OSINT techniques for gathering information about a target domain (e.g., example.com) without sending any traffic directly to the target. For each technique, briefly describe what information it can reveal and name a free tool or service that supports it.
  gold_criteria:
  - lists at least 4 distinct passive techniques
  - mentions certificate transparency (e.g., crt.sh)
  - mentions WHOIS or DNS passive queries
  - mentions search engine dorking or Shodan
  - does not describe active scanning or direct probing
  answer: |-
    1. DNS Enumeration
       Information: Lists DNS records (A, AAAA, CNAME, MX, TXT) associated with the target domain, revealing hostnames and mail servers.
       Tool: dnsenum (open-source) or DNSViz.

    2. WHOIS Lookup
       Information: Registration details (registrar, creation and expiration dates, registrant contact fields when unredacted).
       Tool: whois CLI or whois.domaintools.com.

    3. Passive DNS / Historical DNS Records
       Information: Historical DNS mappings and past IP associations showing when subdomains were added or retired.
       Tool: SecurityTrails / dnsrecord.io free lookup or dig with --trace options.

    4. Subdomain List Aggregation
       Information: Aggregates publicly indexed subdomains without contacting the target host directly.
       Tool: Sublist3r in passive public-source mode.

    5. Web Archive Inspection
       Information: Publicly archived snapshots of pages, retired endpoints, and historical documentation without sending requests to example.com.
       Tool: Wayback Machine (web.archive.org).
  human:
    accuracy: 2
    completeness: 2
    format: 3
